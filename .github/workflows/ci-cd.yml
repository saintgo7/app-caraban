name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: backend
        run: pnpm lint

      - name: Run type check
        working-directory: backend
        run: pnpm tsc --noEmit

      - name: Run tests
        working-directory: backend
        run: pnpm test
        env:
          NODE_ENV: test
          DB_TYPE: sqlite
          JWT_SECRET: test_jwt_secret

      - name: Build
        working-directory: backend
        run: pnpm build

  # Frontend Tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: web
        run: pnpm lint

      - name: Run type check
        working-directory: web
        run: pnpm tsc --noEmit

      - name: Run tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
        env:
          VITE_API_URL: https://api.caraban.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: web/dist
          retention-days: 1

  # Deploy to CDN (only on main - production)
  deploy-cdn:
    name: Deploy to CloudFront CDN
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://cdn.caraban.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: |
          # Deploy assets to S3 with appropriate cache headers
          chmod +x scripts/deploy-to-cdn.sh
          ./scripts/deploy-to-cdn.sh \
            --bucket ${{ secrets.S3_BUCKET_NAME }} \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Verify deployment
        run: |
          echo "✅ CDN deployment successful"
          echo "S3 Bucket: s3://${{ secrets.S3_BUCKET_NAME }}"
          echo "CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"

          # Get CloudFront domain
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' \
            --output text)

          echo "CDN URL: https://${CF_DOMAIN}"

  # Build and Push Docker Images (only on main/develop)
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "BACKEND_TAG=production" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAG=production" >> $GITHUB_OUTPUT
            echo "ENV_SUFFIX=prod" >> $GITHUB_OUTPUT
          else
            echo "BACKEND_TAG=staging" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAG=staging" >> $GITHUB_OUTPUT
            echo "ENV_SUFFIX=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/caraban-backend:${{ steps.tags.outputs.BACKEND_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/caraban-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/caraban-frontend:${{ steps.tags.outputs.FRONTEND_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/caraban-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.caraban.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /var/www/caraban

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart services with zero downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps --build

            # Clean up old images
            docker image prune -af

            # Health check
            sleep 10
            curl -f http://localhost:5000/api/health || exit 1
          EOF

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Staging deployment successful"
          echo "URL: https://staging.caraban.com"

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://caraban.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Backup database
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /var/www/caraban

            # Run backup before deployment
            docker compose -f docker-compose.prod.yml exec -T mariadb \
              mysqldump -u caraban -p$DB_PASSWORD caraban_production \
              | gzip > /backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz
          EOF

      - name: Deploy to production server
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /var/www/caraban

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart services with zero downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps --build

            # Clean up old images
            docker image prune -af

            # Health check
            sleep 15
            curl -f http://localhost:5000/api/health || exit 1
            curl -f http://localhost/ || exit 1
          EOF

      - name: Run smoke tests
        run: |
          # Basic smoke tests
          curl -f https://caraban.com || exit 1
          curl -f https://caraban.com/api/health || exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Production deployment successful"
          echo "URL: https://caraban.com"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /var/www/caraban

            # Rollback to previous version
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
          EOF
          echo "❌ Deployment failed, rolled back to previous version"
