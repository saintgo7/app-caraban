version: '3.8'

services:
  # MariaDB Database (Optional - use when DB_TYPE=mariadb)
  mariadb:
    image: mariadb:11.1
    container_name: caraban-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-caraban_erp}
      MYSQL_USER: ${DB_USER:-caraban}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - caraban-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    profiles:
      - mariadb
      - full

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caraban-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-5000}
      # Database Type: sqlite (default) or mariadb
      DB_TYPE: ${DB_TYPE:-sqlite}
      # SQLite Configuration
      SQLITE_PATH: ${SQLITE_PATH:-./database.sqlite}
      # MariaDB Configuration
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-caraban_erp}
      DB_USER: ${DB_USER:-caraban}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - sqlite_data:/app/database
    networks:
      - caraban-network

  # Backend with MariaDB dependency
  backend-mariadb:
    extends: backend
    depends_on:
      mariadb:
        condition: service_healthy
    profiles:
      - mariadb
      - full

  # Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: caraban-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - caraban-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: caraban-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - caraban-network
    command: redis-server --appendonly yes
    profiles:
      - redis
      - full

volumes:
  mariadb_data:
    driver: local
  sqlite_data:
    driver: local
  redis_data:
    driver: local

networks:
  caraban-network:
    driver: bridge
