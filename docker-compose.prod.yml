version: '3.8'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.1
    container_name: caraban-mariadb-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"  # Only expose to localhost
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - caraban-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: caraban-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"  # Only expose to localhost
    volumes:
      - redis_data:/data
    networks:
      - caraban-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: caraban-backend-prod
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5000:5000"  # Only expose to localhost (nginx will proxy)
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - caraban-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: caraban-web-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - caraban-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Backup Service (runs daily cron job)
  backup:
    image: mariadb:11.1
    container_name: caraban-backup
    restart: always
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - caraban-network
    depends_on:
      - mariadb
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          echo "Running backup at $$(date)"
          sh /backup.sh
          sleep 86400  # Run once per day
        done

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  caraban-network:
    driver: bridge
